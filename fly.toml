# fly.toml app configuration file generated for pulseqa-automated-web-auditing on 2026-11-26T06:44:22Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'pulseqa-automated-web-auditing'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = "sh -c 'cd /app/apps/server && node /app/node_modules/drizzle-kit/bin.cjs migrate'"

[env]
  ALLOW_PRIVATE_HOSTS = 'false'
  ARTIFACTS_DIR = '/data/artifacts'
  CRAWL_MAX_PAGES = '20'
  HISTORY_LIMIT = '10'
  HISTORY_MAX_AGE_DAYS = '10'
  MAX_CONCURRENT_AUDITS = '1'
  PORT = '8080'

[[mounts]]
  source = 'pulseqa_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 50

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
