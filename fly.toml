# Fly.io config for PulseQA (API + dashboard in one Machine).
# Change `app` to a unique name before the first deploy (or let `fly launch --no-deploy` pick one).
app = "pulseqa-audits"
primary_region = "sin" # Singapore — closest to Sri Lanka; pick the region nearest your Neon database

[build]
  dockerfile = "Dockerfile"

[deploy]
  # apply pending Drizzle migrations to Neon before the new version goes live
  release_command = "sh -c 'cd /app/apps/server && node /app/node_modules/drizzle-kit/bin.cjs migrate'"

[env]
  PORT = "8080"
  ALLOW_PRIVATE_HOSTS = "false"
  MAX_CONCURRENT_AUDITS = "1"
  ARTIFACTS_DIR = "/data/artifacts"
  HISTORY_LIMIT = "10"
  HISTORY_MAX_AGE_DAYS = "10"
  CRAWL_MAX_PAGES = "20"
  # CORS_ORIGIN is set as a secret/env after the first deploy (https://<app>.fly.dev)

[http_service]
  internal_port = 8080
  force_https = true
  # Stop the Machine when nobody is using it (keeps it inside the free $5/month);
  # the first request after a stop takes a few seconds to wake it up.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

# Screenshots and session videos survive restarts and deploys
[[mounts]]
  source = "pulseqa_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb" # Chromium + Firefox/WebKit need more than 512 MB
